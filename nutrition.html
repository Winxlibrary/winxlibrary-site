<div class="container">

<h2>Nutrition Assessment Tools</h2>
<p>Use these tools for quick nutrition screening and calculations.</p>

<!-- ✅ BMI CALCULATOR -->
<div class="card">
  <h3>BMI Calculator</h3>

  <label>Weight (kg)</label>
  <input id="weight">

  <label>Height (cm)</label>
  <input id="height">

  <button class="button" onclick="calculateBMI()">Calculate BMI</button>

  <div id="bmiResult" class="result"></div>
</div>

<!-- ✅ Z-SCORE PLACEHOLDER (Next step) -->
<div class="card">
  <h3>Z-Score Calculator (Coming next)</h3>
  <p>
    WHZ, WFA, and HFA tools will be added here using WHO reference data.
  </p>
</div>

</div>

<script>
// ✅ BMI CALCULATION
function calculateBMI() {
  let w = parseFloat(document.getElementById("weight").value);
  let h = parseFloat(document.getElementById("height").value);

  if (!w || !h || w <= 0 || h <= 0) {
    document.getElementById("bmiResult").innerHTML = "Please enter valid values.";
    return;
  }

  let heightM = h / 100;
  let bmi = w / (heightM * heightM);

  let category = "";

  if (bmi < 18.5) category = "Underweight";
  else if (bmi < 25) category = "Normal";
  else if (bmi < 30) category = "Overweight";
  else category = "Obese";

  document.getElementById("bmiResult").innerHTML =
    "<b>BMI:</b> " + bmi.toFixed(2) + "<br>" +
    "<b>Category:</b> " + category;
}
</script>
