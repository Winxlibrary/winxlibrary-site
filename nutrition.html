<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nutrition Assessment - Winxlibrary</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f6f8;
}

.topbar {
  background: #2c3e50;
  color: white;
  padding: 15px;
}

.nav a {
  color: white;
  margin: 0 10px;
  text-decoration: none;
  font-weight: bold;
}

.container {
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  margin: 15px;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.button {
  padding: 8px 15px;
  background: #3498db;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

input, select {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
  margin-bottom: 10px;
  border-radius: 5px;
  border: 1px solid #ccc;
}

.result {
  margin-top: 10px;
  padding: 10px;
  border-radius: 6px;
  background: #eef3f7;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="nav">
    <a href="index.html">Home</a>
    <a href="downloads.html">Downloads</a>
    <a href="support.html">Support</a>
    <a href="about.html">About</a>
  </div>
</div>

<div class="container">

<h2>Nutrition Assessment Tools</h2>

<!-- ✅ BMI FOR AGE -->
<div class="card">
<h3>BMI-for-Age (5–19 years)</h3>

<label>Sex</label>
<select id="sex">
  <option value="boy">Boy</option>
  <option value="girl">Girl</option>
</select>

<label>Age</label>
<div style="display:flex; gap:10px;">
  <input id="ageYears" placeholder="Years">
  <input id="ageMonths" placeholder="Months">
</div>

<label>Weight (kg)</label>
<input id="weight">

<label>Height (cm)</label>
<input id="height">

<button class="button" onclick="calculateBMI()">Calculate</button>

<div id="bmiResult" class="result"></div>
</div>


<!-- ✅ UNDER 5 Z-SCORE -->
<div class="card">
<h3>Weight-for-Length / Height Z-Score (0–59 months)</h3>

<label>Sex</label>
<select id="u5Sex">
  <option value="boy">Boy</option>
  <option value="girl">Girl</option>
</select>

<label>Age (months)</label>
<input id="u5Age">

<label>Length/Height (cm)</label>
<input id="u5Height">

<label>Weight (kg)</label>
<input id="u5Weight">

<button class="button" onclick="calculateUnder5()">Calculate</button>

<div id="u5Result" class="result"></div>
</div>

</div>

<script>

// ================== LOAD FILES ==================
let boysData = {};
let girlsData = {};

fetch('bmi_boys_5_19.json').then(r=>r.json()).then(d=>boysData=d);
fetch('bmi_girls_5_19.json').then(r=>r.json()).then(d=>girlsData=d);

let wflBoys=[], wflGirls=[], wfhBoys=[], wfhGirls=[];

fetch('wfl_boys_0_2_lms.json').then(r=>r.json()).then(d=>wflBoys=d);
fetch('wfl_girls_0_2_lms.json').then(r=>r.json()).then(d=>wflGirls=d);
fetch('wfh_boys_2_5_lms.json').then(r=>r.json()).then(d=>wfhBoys=d);
fetch('wfh_girls_2_5_lms.json').then(r=>r.json()).then(d=>wfhGirls=d);

// ================== BMI FOR AGE ==================
function computeZ(bmi, ref) {
  if (bmi <= ref.m3) return -3;
  if (bmi <= ref.m2) return -3 + (bmi-ref.m3)/(ref.m2-ref.m3);
  if (bmi <= ref.median) return -2 + (bmi-ref.m2)/(ref.median-ref.m2);
  if (bmi <= ref.p2) return (bmi-ref.median)/(ref.p2-ref.median)*2;
  return 2 + (bmi-ref.p2)/(ref.p3-ref.p2);
}

function calculateBMI(){

  let sex = document.getElementById("sex").value;
  let y = parseInt(ageYears.value);
  let m = parseInt(ageMonths.value)||0;
  let w = parseFloat(weight.value);
  let h = parseFloat(height.value);

  if(isNaN(y)||isNaN(w)||isNaN(h)){
    bmiResult.innerHTML="Fill all fields"; return;
  }

  let age=(y*12)+m;
  if(age<61||age>228){bmiResult.innerHTML="5–19 years only"; return;}

  let bmi=w/((h/100)*(h/100));
  let ref=(sex==="boy")?boysData[age]:girlsData[age];
  if(!ref){bmiResult.innerHTML="No reference"; return;}

  let z=computeZ(bmi,ref);

  let cat="";
  if(z<-3)cat="Severe Thinness";
  else if(z<-2)cat="Thinness";
  else if(z<=2)cat="Normal";
  else cat="Overweight/Obese";

  bmiResult.innerHTML=
  "<b>BMI:</b> "+bmi.toFixed(2)+"<br>"+
  "<b>Z-score:</b> "+z.toFixed(2)+"<br>"+
  "<b>Status:</b> "+cat;
}

// ================== LMS FUNCTIONS ==================
function computeLMS(x, ref){
  if(ref.L===0) return Math.log(x/ref.M)/ref.S;
  return (Math.pow(x/ref.M,ref.L)-1)/(ref.L*ref.S);
}

function findClosest(data, h){
  return data.reduce((a,b)=>{
    let ah=a.Height||a.Length;
    let bh=b.Height||b.Length;
    return Math.abs(bh-h)<Math.abs(ah-h)?b:a;
  });
}

// ================== UNDER 5 ==================
function calculateUnder5(){

  let sex=u5Sex.value;
  let age=parseFloat(u5Age.value);
  let h=parseFloat(u5Height.value);
  let w=parseFloat(u5Weight.value);

  if(isNaN(age)||isNaN(h)||isNaN(w)){
    u5Result.innerHTML="Fill all fields"; return;
  }

  if(age<0||age>59){u5Result.innerHTML="0–59 months only"; return;}

  let dataset;

  if(age<=24){
    dataset=(sex==="boy")?wflBoys:wflGirls;
  }else{
    dataset=(sex==="boy")?wfhBoys:wfhGirls;
  }

  let ref=findClosest(dataset,h);
  let z=computeLMS(w,ref);

  let cat="";
  if(z<-3)cat="SAM";
  else if(z<-2)cat="MAM";
  else if(z<=2)cat="Normal";
  else cat="Overweight";

  u5Result.innerHTML=
  "<b>Z-score:</b> "+z.toFixed(2)+"<br>"+
  "<b>Status:</b> "+cat;
}

</script>

</body>
</html>
