// ✅ MAIN FUNCTION
function calculateBMIforAge() {

  let sex = document.getElementById("sex").value;
  let age = parseInt(document.getElementById("age").value);
  let w = parseFloat(document.getElementById("weight").value);
  let h = parseFloat(document.getElementById("height").value);

  if (!age || !w || !h) {
    document.getElementById("bmiResult").innerHTML = "Please complete all fields.";
    return;
  }

  // ✅ Compute BMI
  let bmi = w / ((h / 100) * (h / 100));

  // ✅ Select correct table
  let ref = (sex === "boy") ? boysData[age] : girlsData[age];

  if (!ref) {
    document.getElementById("bmiResult").innerHTML = "Age not available in reference.";
    return;
  }

  let category = "";

  // ✅ Classification using your table
  if (bmi < ref.m3) {
    category = "Severe Thinness (< -3 SD)";
  } else if (bmi < ref.m2) {
    category = "Thinness (-3 to < -2 SD)";
  } else if (bmi < ref.p1) {
    category = "Normal";
  } else if (bmi < ref.p2) {
    category = "Overweight (> +1 SD)";
  } else {
    category = "Obese (> +2 SD)";
  }

  document.getElementById("bmiResult").innerHTML =
    "<b>BMI:</b> " + bmi.toFixed(2) + "<br>" +
    "<b>Category:</b> " + category;
}

</script>
