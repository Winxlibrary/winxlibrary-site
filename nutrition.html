<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nutrition Assessment - Winxlibrary</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f6f8;
}

.topbar {
  background: #2c3e50;
  color: white;
  padding: 15px;
}

.nav a {
  color: white;
  margin: 0 10px;
  text-decoration: none;
  font-weight: bold;
}

.container {
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  margin: 15px;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.button {
  padding: 8px 15px;
  background: #3498db;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

input, select {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
  margin-bottom: 10px;
  border-radius: 5px;
  border: 1px solid #ccc;
}

.result {
  margin-top: 10px;
  padding: 10px;
  border-radius: 6px;
  background: #eef3f7;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="nav">
    <a href="index.html">Home</a>
    <a href="downloads.html">Downloads</a>
    <a href="support.html">Support</a>
    <a href="about.html">About</a>
  </div>
</div>

<div class="container">

<h2>Nutrition Assessment Tools</h2>

<!-- ✅ BMI FOR AGE -->
<div class="card">
  <h3>BMI-for-Age (5–19 years)</h3>

  <label>Sex</label>
  <select id="sex">
    <option value="boy">Boy</option>
    <option value="girl">Girl</option>
  </select>

  <label>Age</label>
  <div style="display:flex; gap:10px;">
    <input id="ageYears" placeholder="Years" type="number" min="5" max="19">
    <input id="ageMonths" placeholder="Months" type="number" min="0" max="11">
  </div>

  <label>Weight (kg)</label>
  <input id="weight" type="number" step="0.1">

  <label>Height (cm)</label>
  <input id="height" type="number" step="0.1">

  <button class="button" onclick="calculateBMI()">Calculate</button>
  <div id="bmiResult" class="result"></div>
</div>

<!-- ✅ UNDER 5 WHZ/WLZ -->
<div class="card">
  <h3>Weight-for-Length / Height Z-Score (0–59 months)</h3>

  <label>Sex</label>
  <select id="u5Sex">
    <option value="boy">Boy</option>
    <option value="girl">Girl</option>
  </select>

  <label>Age (months)</label>
  <input id="u5Age" type="number" min="0" max="59" placeholder="0 - 59">

  <label>Length/Height (cm)</label>
  <input id="u5Height" type="number" step="0.1">

  <label>Weight (kg)</label>
  <input id="u5Weight" type="number" step="0.1">

  <button class="button" onclick="calculateUnder5()">Calculate</button>
  <div id="u5Result" class="result"></div>
</div>

<!-- ✅ WFA -->
<div class="card">
  <h3>Weight-for-Age (WFA) Z-Score (0–59 months)</h3>

  <label>Sex</label>
  <select id="wfaSex">
    <option value="boy">Boy</option>
    <option value="girl">Girl</option>
  </select>

  <label>Age (months)</label>
  <input id="wfaAge" type="number" min="0" max="59" placeholder="0 - 59">

  <label>Weight (kg)</label>
  <input id="wfaWeight" type="number" step="0.1">

  <button class="button" onclick="calculateWFA()">Calculate</button>
  <div id="wfaResult" class="result"></div>
</div>

</div>

<script>
// ================== LOAD FILES ==================
let boysData = {};
let girlsData = {};

fetch('bmi_boys_5_19.json').then(r=>r.json()).then(d=>boysData=d);
fetch('bmi_girls_5_19.json').then(r=>r.json()).then(d=>girlsData=d);

let wflBoys=[], wflGirls=[], wfhBoys=[], wfhGirls=[];
fetch('wfl_boys_0_2_lms.json').then(r=>r.json()).then(d=>wflBoys=d);
fetch('wfl_girls_0_2_lms.json').then(r=>r.json()).then(d=>wflGirls=d);
fetch('wfh_boys_2_5_lms.json').then(r=>r.json()).then(d=>wfhBoys=d);
fetch('wfh_girls_2_5_lms.json').then(r=>r.json()).then(d=>wfhGirls=d);

// WFA (Age is in MONTHS in these files, not years) 【1-9dd257】【2-38eeed】
let wfaBoys=[], wfaGirls=[];
fetch('wfa_boys_0_5_lms.json').then(r=>r.json()).then(d=>wfaBoys=d);
fetch('wfa_girls_0_5_lms.json').then(r=>r.json()).then(d=>wfaGirls=d);

// ================== BMI FOR AGE ==================
function computeZ(bmi, ref) {
  if (bmi <= ref.m3) return -3;
  if (bmi <= ref.m2) return -3 + (bmi-ref.m3)/(ref.m2-ref.m3);
  if (bmi <= ref.median) return -2 + (bmi-ref.m2)/(ref.median-ref.m2);
  if (bmi <= ref.p2) return (bmi-ref.median)/(ref.p2-ref.median)*2;
  return 2 + (bmi-ref.p2)/(ref.p3-ref.p2);
}

function calculateBMI(){
  const sex = document.getElementById("sex").value;
  const y = parseInt(document.getElementById("ageYears").value);
  const m = parseInt(document.getElementById("ageMonths").value) || 0;
  const w = parseFloat(document.getElementById("weight").value);
  const h = parseFloat(document.getElementById("height").value);

  if (isNaN(y) || isNaN(w) || isNaN(h)) {
    document.getElementById("bmiResult").innerHTML = "Fill all fields";
    return;
  }

  const age = (y*12) + m;
  if (age < 61 || age > 228) {
    document.getElementById("bmiResult").innerHTML = "5–19 years only";
    return;
  }

  const bmi = w / ((h/100)*(h/100));
  const ref = (sex==="boy") ? boysData[age] : girlsData[age];
  if (!ref) {
    document.getElementById("bmiResult").innerHTML = "No reference for this age";
    return;
  }

  const z = computeZ(bmi, ref);

  let cat="";
  if (z < -3) cat="Severe Thinness";
  else if (z < -2) cat="Thinness";
  else if (z <= 2) cat="Normal";
  else cat="Overweight/Obese";

  document.getElementById("bmiResult").innerHTML =
    "<b>BMI:</b> " + bmi.toFixed(2) + "<br>" +
    "<b>Z-score:</b> " + z.toFixed(2) + "<br>" +
    "<b>Status:</b> " + cat;
}

// ================== LMS HELPERS (matches phone approach: interpolate LMS) 【1-0101f4】
function lmsZ(v, L, M, S) {
  if (L === 0) return Math.log(v / M) / S;
  return (Math.pow(v / M, L) - 1) / (L * S);
}

// Linear interpolation
function lerp(a,b,t){ return a + (b-a)*t; }

// Interpolate LMS row by x (x is months for WFA/HFA tables, or cm for WFL/WFH tables)
function interpLMS(table, x, keyName){
  if (!table || table.length === 0) return null;

  // Ensure sorted by key
  const t = table.slice().sort((a,b) => (a[keyName]||0) - (b[keyName]||0));

  if (x <= t[0][keyName]) return { L:t[0].L, M:t[0].M, S:t[0].S, x: t[0][keyName] };
  if (x >= t[t.length-1][keyName]) {
    const last = t[t.length-1];
    return { L:last.L, M:last.M, S:last.S, x: last[keyName] };
  }

  // find first >= x
  let i = 1;
  while (i < t.length && t[i][keyName] < x) i++;

  const a = t[i-1], b = t[i];
  const ax = a[keyName], bx = b[keyName];
  const ratio = (x - ax) / (bx - ax);

  return {
    L: lerp(a.L, b.L, ratio),
    M: lerp(a.M, b.M, ratio),
    S: lerp(a.S, b.S, ratio),
    x: x
  };
}

// For WFL/WFH your key differs (Length/Height). This keeps your earlier closest approach.
// (We can upgrade later to interpolate too, like your phone does.) 【1-0101f4】
function findClosest(data, h){
  return data.reduce((a,b)=>{
    const ah = a.Height || a.Length;
    const bh = b.Height || b.Length;
    return Math.abs(bh-h) < Math.abs(ah-h) ? b : a;
  });
}

// ================== UNDER 5 WHZ/WLZ ==================
function calculateUnder5(){
  const sex = document.getElementById("u5Sex").value;
  const age = parseFloat(document.getElementById("u5Age").value);
  const h = parseFloat(document.getElementById("u5Height").value);
  const w = parseFloat(document.getElementById("u5Weight").value);

  if (isNaN(age) || isNaN(h) || isNaN(w)) {
    document.getElementById("u5Result").innerHTML = "Fill all fields";
    return;
  }
  if (age < 0 || age > 59) {
    document.getElementById("u5Result").innerHTML = "0–59 months only";
    return;
  }

  const dataset = (age <= 24)
    ? ((sex==="boy") ? wflBoys : wflGirls)
    : ((sex==="boy") ? wfhBoys : wfhGirls);

  if (!dataset || dataset.length === 0) {
    document.getElementById("u5Result").innerHTML = "Data loading...";
    return;
  }

  // Simple closest (works), can be upgraded to interpolation later
  const ref = findClosest(dataset, h);
  const z = lmsZ(w, ref.L, ref.M, ref.S);

  let cat="";
  if (z < -3) cat="SAM";
  else if (z < -2) cat="MAM";
  else if (z <= 2) cat="Normal";
  else cat="Overweight";

  document.getElementById("u5Result").innerHTML =
    "<b>Z-score:</b> " + z.toFixed(2) + "<br>" +
    "<b>Status:</b> " + cat;
}

// ================== ✅ WFA (Correct: AGE IS MONTHS, interpolate like phone) 【1-0101f4】【1-9dd257】【2-38eeed】
function calculateWFA(){
  const sex = document.getElementById("wfaSex").value;
  const ageMonths = parseFloat(document.getElementById("wfaAge").value);
  const weightKg = parseFloat(document.getElementById("wfaWeight").value);

  const out = document.getElementById("wfaResult");

  if (isNaN(ageMonths) || isNaN(weightKg)) {
    out.innerHTML = "Fill all fields";
    return;
  }
  if (ageMonths < 0 || ageMonths > 59) {
    out.innerHTML = "0–59 months only";
    return;
  }

  const table = (sex==="boy") ? wfaBoys : wfaGirls;
  if (!table || table.length === 0) {
    out.innerHTML = "Data loading...";
    return;
  }

  // ✅ Interpolate LMS at ageMonths using key 'Age' (which is months in your files) 【1-9dd257】【2-38eeed】【1-0101f4】
  const r = interpLMS(table, ageMonths, "Age");
  if (!r) {
    out.innerHTML = "Reference not found";
    return;
  }

  const z = lmsZ(weightKg, r.L, r.M, r.S);

  let cat="";
  if (z < -3) cat="Severe Underweight";
  else if (z < -2) cat="Underweight";
  else if (z <= 2) cat="Normal";
  else cat="Possible Overweight";

  // Show matched age for easy verification
  out.innerHTML =
    "<b>Age (months):</b> " + ageMonths.toFixed(2) + "<br>" +
    "<b>Weight:</b> " + weightKg.toFixed(2) + " kg<br>" +
    "<b>WFA Z-score:</b> " + z.toFixed(2) + "<br>" +
    "<b>Status:</b> " + cat;
}
</script>

</body>
</html>
