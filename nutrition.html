<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Nutrition Assessment - Winxlibrary</title>

<style>
body { font-family: Arial; margin: 0; background: #f4f6f8; }

.topbar { background: #2c3e50; color: white; padding: 15px; }

.nav a { color: white; margin: 0 10px; text-decoration: none; font-weight: bold; }

.container { padding: 20px; }

.card {
  background: white;
  padding: 20px;
  margin: 15px 0;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.button {
  padding: 10px 16px;
  background: #3498db;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

input, select {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.result {
  margin-top: 12px;
  padding: 12px;
  border-radius: 10px;
  background: #eef3f7;
}

.rows { display: grid; gap: 10px; }

.row {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  border-radius: 10px;
  background: white;
}

.badge {
  padding: 5px 10px;
  border-radius: 20px;
  font-weight: bold;
}

.bg-red { background:#fdecea;color:#b02a37; }
.bg-yellow { background:#fff4d6;color:#8a6d00; }
.bg-green { background:#e7f7ee;color:#1f7a3a; }
</style>
</head>

<body>


  
<div class="container">

<h2>Nutrition Assessment Tools</h2>

<!-- ✅ BMI -->
<div class="card">
<h3>BMI-for-Age</h3>

<select id="sex">
<option value="boy">Boy</option>
<option value="girl">Girl</option>
</select>

<input id="ageYears" placeholder="Years">
<input id="ageMonths" placeholder="Months">

<input id="weight" placeholder="Weight kg">
<input id="height" placeholder="Height cm">

<button onclick="calculateBMI()">Calculate</button>
<div id="bmiResult"></div>
</div>

<!-- ✅ Z SCORE -->
<div class="card">
<h3>Child Z-Score</h3>

<select id="childSex">
<option value="boy">Boy</option>
<option value="girl">Girl</option>
</select>

<input id="childAge" placeholder="Age months">
<input id="childWeight" placeholder="Weight">
<input id="childHeight" placeholder="Height">

<button onclick="calculateZScores()">Calculate</button>

<div id="zResult" class="result"></div>
</div>

<!-- ✅ WIZARD -->
<div class="card">
<h3>Z-Score Wizard</h3>

<div id="w1">
<label>Sex</label>
<select id="wSex">
<option value="boy">Boy</option>
<option value="girl">Girl</option>
</select>
<button onclick="wNext(2)">Next</button>
</div>

<div id="w2" style="display:none;">
<label>Age</label>
<input id="wAge">
<button onclick="wNext(3)">Next</button>
<button onclick="wNext(1)">Back</button>
</div>

<div id="w3" style="display:none;">
<label>Weight</label>
<input id="wWeight">
<button onclick="wNext(4)">Next</button>
<button onclick="wNext(2)">Back</button>
</div>

<div id="w4" style="display:none;">
<label>Height</label>
<input id="wHeight">
<button onclick="runWizard()">Finish</button>
<button onclick="wNext(3)">Back</button>
</div>

<div id="w5" style="display:none;">
<div id="wizardResult" class="result"></div>
</div>

</div>

</div>

<script>

// ✅ BMI
function calculateBMI(){
let w=weight.value;
let h=height.value/100;
if(!w||!h)return;
let bmi=w/(h*h);
bmiResult.innerHTML="BMI: "+bmi.toFixed(2);
}

// ✅ LMS
function lmsZ(v,L,M,S){
if(L===0)return Math.log(v/M)/S;
return (Math.pow(v/M,L)-1)/(L*S);
}

// ✅ CLASSIFICATION
function classify(z){
if(z<-3)return["Severe","bg-red"];
if(z<-2)return["Moderate","bg-yellow"];
return["Normal","bg-green"];
}

// ✅ Z CALC
function calculateZScores(){

let w=parseFloat(childWeight.value);
let h=parseFloat(childHeight.value);
let a=parseFloat(childAge.value);

if(!w||!h||!a)return;

let whz=lmsZ(w,1,h/10,0.1);
let wfa=lmsZ(w,1,a/5,0.1);
let hfa=lmsZ(h,1,a+60,0.1);

let r1=classify(whz);
let r2=classify(wfa);
let r3=classify(hfa);

zResult.innerHTML=

"<div class='rows'>"

+"<div class='row'>WHZ "+whz.toFixed(2)+" <span class='badge "+r1[1]+"'>"+r1[0]+"</span></div>"

+"<div class='row'>WFA "+wfa.toFixed(2)+" <span class='badge "+r2[1]+"'>"+r2[0]+"</span></div>"

+"<div class='row'>HFA "+hfa.toFixed(2)+" <span class='badge "+r3[1]+"'>"+r3[0]+"</span></div>"

+"</div>"

+"<br><b>Below-normal zones:</b><br>"
+"• <span class='badge bg-red'>Z < -3</span> Severe<br>"
+"• <span class='badge bg-yellow'>-3 ≤ Z < -2</span> Moderate";

}

// ✅ WIZARD
function wNext(n){
for(let i=1;i<=5;i++){
document.getElementById("w"+i).style.display="none";
}
document.getElementById("w"+n).style.display="block";
}

function runWizard(){
childSex.value=wSex.value;
childAge.value=wAge.value;
childWeight.value=wWeight.value;
childHeight.value=wHeight.value;

calculateZScores();

wizardResult.innerHTML=zResult.innerHTML;

wNext(5);
}

</script>

</body>
</html>
