<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nutrition Assessment - Winxlibrary</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f6f8;
}

.topbar {
  background: #2c3e50;
  color: white;
  padding: 15px;
}

.nav a {
  color: white;
  margin: 0 10px;
  text-decoration: none;
  font-weight: bold;
}

.container {
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  margin: 15px;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.button {
  padding: 8px 15px;
  background: #3498db;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

input, select {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
  margin-bottom: 10px;
  border-radius: 5px;
  border: 1px solid #ccc;
}

.result {
  margin-top: 10px;
  padding: 10px;
  border-radius: 6px;
  background: #eef3f7;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="nav">
    <a href="index.html">Home</a>
    <a href="downloads.html">Downloads</a>
    <a href="support.html">Support</a>
    <a href="about.html">About</a>
  </div>
</div>

<div class="container">

<h2>Nutrition Assessment Reference Tools</h2>
<p>Use these tools for quick nutrition screening and calculations.</p>

<div class="card">
  <h3>BMI-for-Age (5–19 years)</h3>

  <label>Sex</label>
  <select id="sex">
    <option value="boy">Boy</option>
    <option value="girl">Girl</option>
  </select>

  <label>Age</label>
  <div style="display:flex; gap:10px;">
    <input id="ageYears" type="number" placeholder="Years">
    <input id="ageMonths" type="number" placeholder="Months">
  </div>

  <label>Weight (kg)</label>
  <input id="weight">

  <label>Height (cm)</label>
  <input id="height">

  <button class="button" onclick="calculateBMIforAge()">Calculate</button>

  <div id="bmiResult" class="result"></div>
</div>

</div>

<script>

let boysData = {};
let girlsData = {};

// ✅ Load JSON files
fetch('bmi_boys_5_19.json')
  .then(res => res.json())
  .then(data => boysData = data);

fetch('bmi_girls_5_19.json')
  .then(res => res.json())
  .then(data => girlsData = data);

// ✅ Z-score calculation
function computeZScore(bmi, ref) {

  if (bmi <= ref.m3) return -3;

  if (bmi <= ref.m2) {
    return -3 + (bmi - ref.m3) / (ref.m2 - ref.m3);
  }

  if (bmi <= ref.median) {
    return -2 + (bmi - ref.m2) / (ref.median - ref.m2);
  }

  if (bmi <= ref.p2) {
    return (bmi - ref.median) / (ref.p2 - ref.median) * 2;
  }

  if (bmi <= ref.p3) {
    return 2 + (bmi - ref.p2) / (ref.p3 - ref.p2);
  }

  return 3;
}

// ✅ MAIN FUNCTION
function calculateBMIforAge() {

  let sex = document.getElementById("sex").value;

  let years = parseInt(document.getElementById("ageYears").value);
  let months = parseInt(document.getElementById("ageMonths").value) || 0;

  let weight = parseFloat(document.getElementById("weight").value);
  let height = parseFloat(document.getElementById("height").value);

  if (isNaN(years)) {
    document.getElementById("bmiResult").innerHTML = "Enter age in years.";
    return;
  }

  if (isNaN(weight) || isNaN(height)) {
    document.getElementById("bmiResult").innerHTML = "Enter weight and height.";
    return;
  }

  let age = (years * 12) + months;

  if (age < 61 || age > 228) {
    document.getElementById("bmiResult").innerHTML =
      "Age must be between 5 and 19 years.";
    return;
  }

  let bmi = weight / ((height / 100) * (height / 100));

  let ref = (sex === "boy") ? boysData[age] : girlsData[age];

  if (!ref) {
    document.getElementById("bmiResult").innerHTML =
      "Age not found in reference.";
    return;
  }

  // ✅ NOW compute Z-score AFTER ref exists
  let z = computeZScore(bmi, ref);

  let category = "";

  if (bmi < ref.m3) category = "Severe Thinness";
  else if (bmi < ref.m2) category = "Thinness";
  else if (bmi < ref.p1) category = "Normal";
  else if (bmi < ref.p2) category = "Overweight";
  else category = "Obese";

  let advice = "";

  if (category.includes("Severe")) {
    advice = "Urgent referral required.";
  } else if (category.includes("Thinness")) {
    advice = "Provide nutrition support and follow-up.";
  } else if (category === "Normal") {
    advice = "Growth is normal.";
  } else if (category.includes("Overweight")) {
    advice = "Monitor diet and growth.";
  } else {
    advice = "Refer for further evaluation.";
  }

  let color = "#ccc";

  if (category.includes("Severe")) color = "#ff4d4d";
  else if (category.includes("Thinness")) color = "#ffc107";
  else if (category === "Normal") color = "#28a745";
  else if (category.includes("Overweight")) color = "#fd7e14";
  else if (category.includes("Obese")) color = "#dc3545";

  document.getElementById("bmiResult").innerHTML =
    "<div style='border-left:6px solid " + color + "; padding:10px;'>" +
    "<b>Age:</b> " + years + "y " + months + "m (" + age + " months)<br>" +
    "<b>BMI:</b> " + bmi.toFixed(2) + "<br>" +
    "<b>Z-score:</b> " + z.toFixed(2) + "<br>" +
    "<b>Status:</b> <span style='color:" + color + "; font-weight:bold'>" + category + "</span><br>" +
    "<b>Advice:</b> " + advice +
    "</div>";
}

</script>

</body>
</html>
