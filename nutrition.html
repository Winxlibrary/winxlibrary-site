<body>

<div class="topbar">
  <div class="nav">
    <a href="index.html">Home</a>
    <a href="downloads.html">Downloads</a>
    <a href="support.html">Support</a>
    <a href="about.html">About</a>

<div class="container">

<h2>Nutrition Assessment Tools</h2>
<p>Use these tools for quick nutrition screening and calculations.</p>

<!-- ✅ BMI CALCULATOR -->
<!-- ✅ BMI FOR AGE (5–19y) -->
<div class="card">
  <h3>BMI-for-Age (5–19 years)</h3>

  <label>Sex</label>
  <select id="sex">
    <option value="boy">Boy</option>
    <option value="girl">Girl</option>
  </select>

  <label>Age (months)</label>
  <input id="age" type="number">

  <label>Weight (kg)</label>
  <input id="weight">

  <label>Height (cm)</label>
  <input id="height">

  <button class="button" onclick="calculateBMIforAge()">Calculate</button>

  <div id="bmiResult" class="result"></div>
</div>

<!-- ✅ Z-SCORE PLACEHOLDER (Next step) -->
<div class="card">
  <h3>Z-Score Calculator (Coming next)</h3>
  <p>
    WHZ, WFA, and HFA tools will be added here using WHO reference data.
  </p>
</div>

</div>

<script>

let boysData = {};
let girlsData = {};

// ✅ Load JSON files
fetch('bmi_boys_5_19.json')
  .then(res => res.json())
  .then(data => boysData = data);

fetch('bmi_girls_5_19.json')
  .then(res => res.json())
  .then(data => girlsData = data);

// ✅ BMI function
function calculateBMIforAge() {

  let sex = document.getElementById("sex").value;
  let age = parseInt(document.getElementById("age").value);
  let w = parseFloat(document.getElementById("weight").value);
  let h = parseFloat(document.getElementById("height").value);

  if (!age || !w || !h) {
    document.getElementById("bmiResult").innerHTML = "Fill all fields.";
    return;
  }

  let bmi = w / ((h/100)*(h/100));

  let ref = (sex === "boy") ? boysData[age] : girlsData[age];

  if (!ref) {
    document.getElementById("bmiResult").innerHTML = "Age not found.";
    return;
  }

  let category = "";

  if (bmi < ref.m3) category = "Severe Thinness";
  else if (bmi < ref.m2) category = "Thinness";
  else if (bmi < ref.p1) category = "Normal";
  else if (bmi < ref.p2) category = "Overweight";
  else category = "Obese";

  document.getElementById("bmiResult").innerHTML =
    "<b>BMI:</b> " + bmi.toFixed(2) + "<br>" +
    "<b>Status:</b> " + category;
}

</script>

</body>
</html>
