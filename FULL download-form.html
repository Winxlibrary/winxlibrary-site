<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Download IYCF Analyse</title>

<style>
body {
  font-family: Arial;
  background: #f4f6f8;
}
.container {
  max-width: 500px;
  margin: auto;
  margin-top: 60px;
}
.card {
  background: white;
  padding: 25px;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}
input {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  margin-bottom: 15px;
}
button {
  background: #3498db;
  color: white;
  padding: 12px;
  border: none;
  width: 100%;
  border-radius: 5px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">
    <h2>Download IYCF Analyse</h2>

    <p>Please complete this form before downloading:</p>

    <form id="downloadForm">

      <label>Name</label>
      <input type="text" id="name" required>

      <label>Title / Profession</label>
      <input type="text" id="title" required>

      <label>Organisation</label>
      <input type="text" id="org" required>

      <label>Country</label>
      <input type="text" id="country" required>

      <button type="submit">Submit & Download</button>
    </form>

    <p style="font-size:12px; color:gray;">
      We collect this information to understand usage and improve the application.
      Your data will not be shared with third parties.
    </p>

  </div>
</div>

<script>
document.getElementById("downloadForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const data = {
    name: document.getElementById("name").value,
    title: document.getElementById("title").value,
    org: document.getElementById("org").value,
    country: document.getElementById("country").value,
    date: new Date().toISOString()
  };

  console.log("Download data:", data);

  // ✅ Redirect to download (GitHub release)
  window.location.href =
  "https://github.com/Winxlibrary/iycf-analyse/releases/download/v1.1.1/Winxli_IYCF_analyse.exe";
});
</script>

</body>
</html>
