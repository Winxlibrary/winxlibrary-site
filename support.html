<style>
body {
  font-family: Arial;
  background: #f4f6f8;
  margin: 0;
}

.nav {
  background: #2c3e50;
  padding: 10px;

h1, h3 {

input, textarea {
  width: 100%;

  border-radius: 5px;

}

button {
  background: #2c3e50;

  border: none;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background: #34495e;
}

/* WhatsApp button */
.whatsapp-btn {
  display: inline-block;
  background: #25D366;
  color: white;

  border-radius: 5px;
}

.whatsapp-btn i {
  margin-right: 8px;
}

.success {
  color: green;
  font-weight: bold;
  display: none;

</style>

</head>

<body>

<div class="nav">
  <a href="index.html">Home</a>
  <a href="downloads.html">Downloads</a>
  <a href="support.html">Support</a>
  <a href="about.html">About</a>
</div>

<div class="container">
  
<h1 style="font-family: Arial; color:#2c3e50;">
  📚 WinxLibrary
</h1>
<h1>Support</h1>

<p>Need help? Contact us via WhatsApp or send a message below.</p>

<h3>WhatsApp</h3>

<a href="https://wa.me/256775937437?text=Hello%20I%20need%20help" 
   class="whatsapp-btn" target="_blank">
  <i class="fa fa-whatsapp"></i> Chat on WhatsApp
</a>

<hr>

<h3>Send Feedback, We are here for you!</h3>

<form id="contactForm" action="https://formspree.io/f/xvzyrpzl" method="POST">
  
  <label>Your Name:</label>
  <input type="text" name="name" required>

  <label>Your Email:</label>
  <input type="email" name="email" required>

  <label>Your Message:</label>
  <textarea name="message" rows="5" required></textarea>

  <button type="submit">Send Message</button>

</form>

<p id="successMsg" class="success">✅ Message sent successfully!</p>

<h3>Tip</h3>
<p>Include your license key and error message when contacting support.</p>

</div>

<script>
const form = document.getElementById("contactForm");

form.addEventListener("submit", function(e) {
  e.preventDefault();

  fetch(form.action, {
    method: "POST",
    body: new FormData(form),
    headers: {
      'Accept': 'application/json'
    }
  })
  .then(response => {
    if (response.ok) {
      document.getElementById("successMsg").style.display = "block";
      form.reset();
    } else {
      alert("Something went wrong. Try again.");
    }
  })
  .catch(error => {
    alert("Error sending message.");
  });
});
</script>

</body>
</html>
